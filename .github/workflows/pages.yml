name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: |
            melact/package-lock.json
            meltea/package-lock.json

      - name: Build Melact
        working-directory: melact
        env:
          SITE_BASE: /${{ github.event.repository.name }}/melact/
        run: |
          npm ci
          npm run build

      - name: Build Meltea
        working-directory: meltea
        env:
          SITE_BASE: /${{ github.event.repository.name }}/meltea/
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R index/. site/
          cp -R melact/dist site/melact
          cp -R meltea/dist site/meltea
          touch site/.nojekyll

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
