<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 466" width="896" height="466" role="img" aria-label="One record per row instead of a dozen objects. What one row of a compiled list keeps alive, before and now. What one row of a compiled list holds. Before: a child description with build and patch closures, a with_key wrapper, a refresh closure, a mounted child with three closures, a compiled state with a lend closure, a scope with its deps, a holes array with five hole records, two handler closures and a projection array. Now: one Mounted_row record with the root, the scope and the holes, the scope&#x27;s deps also holding the last written values, the holes as bare nodes, the handler data as a property of the element, and the projection array; the template, one refresh per list, the key function and one handler per site are shared. Creating 1,000 rows allocates about 430 kB instead of 939, and 1,000 rows take 1.22 MB instead of 1.68"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">MEMORY PER ROW</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">One record per row instead of a dozen objects</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">What one row of a compiled list keeps alive, before and now.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="18" font-size="14" xml:space="preserve" class="orange" font-weight="700">a row before</text><text x="0" y="37" font-size="11.5" xml:space="preserve" class="muted">View.each over generic children</text><rect x="0" y="52" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="69.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">child { build; patch; shape }</text><text x="388" y="69.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">+2 closures</text><rect x="0" y="83" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="100.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">with_key + Entry</text><text x="388" y="100.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">2 blocks</text><rect x="0" y="114" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="131.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">refresh closure</text><text x="388" y="131.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">per row</text><rect x="0" y="145" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="162.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">live { each; front; release }</text><text x="388" y="162.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">+3 closures</text><rect x="0" y="176" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="193.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">Compiled_state + lend</text><text x="388" y="193.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">+1 closure</text><rect x="0" y="207" width="400" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="12" y="224.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">scope + deps</text><text x="388" y="224.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end"></text><rect x="0" y="238" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="255.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">holes array + 5 hole records</text><text x="388" y="255.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">6 blocks</text><rect x="0" y="269" width="400" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="12" y="286.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">2 handler closures</text><text x="388" y="286.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">per row</text><rect x="0" y="300" width="400" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="12" y="317.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">projection array</text><text x="388" y="317.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end"></text><text x="480" y="18" font-size="14" xml:space="preserve" class="green" font-weight="700">a row now</text><text x="480" y="37" font-size="11.5" xml:space="preserve" class="muted">View.rows, flat holes, linked handlers</text><rect x="480" y="52" width="400" height="26" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/><text x="492" y="69.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">Mounted_row { root; scope; holes }</text><text x="868" y="69.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">1 block</text><rect x="480" y="83" width="400" height="26" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/><text x="492" y="100.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">scope + deps</text><text x="868" y="100.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">+ the last written values</text><rect x="480" y="114" width="400" height="26" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/><text x="492" y="131.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">holes: the bare nodes</text><text x="868" y="131.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">no hole records</text><rect x="480" y="145" width="400" height="26" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/><text x="492" y="162.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">element.$$melhole:data1 = id</text><text x="868" y="162.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end">no closure</text><rect x="480" y="176" width="400" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="492" y="193.5" font-size="11.5" xml:space="preserve" class="mono" font-weight="600">projection array</text><text x="868" y="193.5" font-size="11" xml:space="preserve" class="muted" text-anchor="end"></text><rect x="480" y="248" width="400" height="76" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1.3"/><text x="498" y="272" font-size="12.5" xml:space="preserve" class="accent" font-weight="700">shared, not per row</text><text x="498" y="292" font-size="11.5" xml:space="preserve" class="muted">the template and one refresh per list, the key function,</text><text x="498" y="309" font-size="11.5" xml:space="preserve" class="muted">one handler per site (View.link) per dispatch</text><line x1="420" y1="160" x2="466" y2="160" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><text x="440" y="350" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">Creating 1,000 rows of the benchmark allocates about 430 kB instead of 939; 1,000 rows take 1.22 MB instead of 1.68.</text></g></svg>