<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 542" width="896" height="542" role="img" aria-label="Hydration in React&#x27;s own HTML format. No markers. The server&#x27;s elements are kept, and clicks made before the code arrives are replayed. Server rendering and hydration in React&#x27;s format: on the server Program.render, renderToString or server-reason-react write plain HTML with no markers, and a comment only between two adjacent texts; in the browser, code the compiler generated for each template walks the server&#x27;s nodes in document order, after an off-page clone has let the template&#x27;s own refresh compute the values: the root with the same tag is taken over, texts and lists take exactly their nodes, and the buttons get their handlers; no element is added to the page, and HTML that does not match the view is cleared and mounted from scratch. Before the code arrives, Melhole_server.capture in the page&#x27;s head records clicks, typing and key presses on document with each target&#x27;s value at that moment, and hydration delivers them in order through the live paths once the program runs"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">SERVER RENDERING</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Hydration in React&#x27;s own HTML format</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">No markers. The server&#x27;s elements are kept, and clicks made before the code arrives are replayed.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="0" y="0" width="290" height="300" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.4" filter="url(#lift)"/><text x="18" y="28" font-size="14" xml:space="preserve" font-weight="700">1 · on the server</text><text x="18" y="47" font-size="11.5" xml:space="preserve" class="muted">Program.render · renderToString</text><text x="18" y="80" font-size="11.5" xml:space="preserve" class="mono">&lt;div class=&quot;counter&quot;&gt;</text><text x="18" y="100" font-size="11.5" xml:space="preserve" class="mono">  &lt;button&gt;-&lt;/button&gt;</text><text x="18" y="120" font-size="11.5" xml:space="preserve" class="mono">  &lt;output class=&quot;&quot;&gt;<tspan class="green">41</tspan>&lt;/output&gt;</text><text x="18" y="140" font-size="11.5" xml:space="preserve" class="mono">  &lt;button&gt;+&lt;/button&gt;</text><text x="18" y="160" font-size="11.5" xml:space="preserve" class="mono">  &lt;button&gt;reset&lt;/button&gt;</text><text x="18" y="180" font-size="11.5" xml:space="preserve" class="mono">&lt;/div&gt;</text><text x="18" y="200" font-size="11.5" xml:space="preserve" class="mono"></text><text x="18" y="220" font-size="11.5" xml:space="preserve" class="mono">&lt;p&gt;count: <tspan class="orange">&lt;!-- --&gt;</tspan><tspan class="green">41</tspan>&lt;/p&gt;</text><text x="18" y="258" font-size="11.5" xml:space="preserve" class="muted">React&#x27;s format: no markers at all,</text><text x="18" y="276" font-size="11.5" xml:space="preserve" class="muted">&lt;!-- --&gt; only between two texts</text><line x1="294" y1="150" x2="326" y2="150" stroke="#b58cff" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><rect x="330" y="0" width="290" height="300" rx="14" fill="#161b22" stroke="#b58cff" stroke-width="1.4" filter="url(#lift)"/><text x="348" y="28" font-size="14" xml:space="preserve" font-weight="700">2 · in the browser: hydrate</text><text x="348" y="47" font-size="11.5" xml:space="preserve" class="muted">compiled adopt code, in document order</text><circle cx="352" cy="74" r="4" fill="#b58cff"/><text x="364" y="78" font-size="12" xml:space="preserve" class="mono" font-weight="700">off-page clone</text><text x="364" y="96" font-size="11.5" xml:space="preserve" class="muted">the template&#x27;s own refresh reads the values</text><circle cx="352" cy="126" r="4" fill="#b58cff"/><text x="364" y="130" font-size="12" xml:space="preserve" class="mono" font-weight="700">div.counter</text><text x="364" y="148" font-size="11.5" xml:space="preserve" class="muted">same tag: taken over, not cloned</text><circle cx="352" cy="178" r="4" fill="#b58cff"/><text x="364" y="182" font-size="12" xml:space="preserve" class="mono green" font-weight="700">41</text><text x="364" y="200" font-size="11.5" xml:space="preserve" class="muted">taken over; a list takes its own rows</text><circle cx="352" cy="230" r="4" fill="#b58cff"/><text x="364" y="234" font-size="12" xml:space="preserve" class="mono" font-weight="700">3 × button</text><text x="364" y="252" font-size="11.5" xml:space="preserve" class="muted">handlers set; nothing else is written</text><line x1="624" y1="110" x2="656" y2="110" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><rect x="660" y="0" width="220" height="196" rx="14" fill="#12261a" stroke="#3fb950" stroke-width="1.5" filter="url(#lift)"/><text x="770" y="30" font-size="13.5" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">3 · the same page, live</text><rect x="690" y="48" width="160" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="698" y="54" width="30" height="32" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="713" y="76" font-size="15" xml:space="preserve" font-weight="600" text-anchor="middle">−</text><rect x="812" y="54" width="30" height="32" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="827" y="76" font-size="15" xml:space="preserve" font-weight="600" text-anchor="middle">+</text><text x="770" y="77" font-size="18" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">41</text><text x="770" y="122" font-size="12" xml:space="preserve" font-weight="600" text-anchor="middle">no element added to the page</text><text x="770" y="144" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">every element is the server&#x27;s;</text><text x="770" y="162" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">React&#x27;s and server-reason-react&#x27;s</text><text x="770" y="180" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">HTML hydrate the same way</text><rect x="660" y="212" width="220" height="88" rx="14" fill="#2b1d12" stroke="#f0883e" stroke-width="1.3"/><text x="678" y="240" font-size="13" xml:space="preserve" class="orange" font-weight="700">HTML that does not match</text><text x="678" y="262" font-size="11.5" xml:space="preserve" class="muted">the view: the root is cleared</text><text x="678" y="280" font-size="11.5" xml:space="preserve" class="muted">and mounted from scratch</text><rect x="0" y="322" width="880" height="112" rx="14" fill="#0f2136" stroke="#58a6ff" stroke-width="1.3"/><text x="18" y="348" font-size="13.5" xml:space="preserve" class="blue" font-weight="700">between 1 and 2 · before the code arrives</text><text x="326" y="348" font-size="11.5" xml:space="preserve" class="muted">Melhole_server.capture in &lt;head&gt; records them, with each value then</text><rect x="18" y="364" width="112" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/><text x="28" y="384" font-size="11.5" xml:space="preserve" class="mono blue" font-weight="700">click</text><text x="120" y="384" font-size="11.5" xml:space="preserve" class="mono" text-anchor="end">−</text><rect x="142" y="364" width="112" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/><text x="152" y="384" font-size="11.5" xml:space="preserve" class="mono blue" font-weight="700">input</text><text x="244" y="384" font-size="11.5" xml:space="preserve" class="mono" text-anchor="end">&quot;mi&quot;</text><line x1="130" y1="379" x2="140" y2="379" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrow-blue)"/><rect x="266" y="364" width="112" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/><text x="276" y="384" font-size="11.5" xml:space="preserve" class="mono blue" font-weight="700">input</text><text x="368" y="384" font-size="11.5" xml:space="preserve" class="mono" text-anchor="end">&quot;milk&quot;</text><line x1="254" y1="379" x2="264" y2="379" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrow-blue)"/><rect x="390" y="364" width="112" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/><text x="400" y="384" font-size="11.5" xml:space="preserve" class="mono blue" font-weight="700">keydown</text><text x="492" y="384" font-size="11.5" xml:space="preserve" class="mono" text-anchor="end">Enter</text><line x1="378" y1="379" x2="388" y2="379" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrow-blue)"/><text x="18" y="418" font-size="11.5" xml:space="preserve" class="muted">the page looks alive but nothing runs: the events wait, in order</text><line x1="512" y1="379" x2="552" y2="379" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow-blue)" class="flow"/><text x="532" y="368" font-size="11" xml:space="preserve" class="mono muted" text-anchor="middle">hydrate</text><rect x="560" y="352" width="302" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="576" y="375" font-size="12.5" xml:space="preserve" font-weight="700">delivered once the program runs</text><text x="576" y="393" font-size="11.5" xml:space="preserve" class="muted">through the live paths, each target</text><text x="576" y="409" font-size="11.5" xml:space="preserve" class="muted">showing the value it had at that event</text></g></svg>