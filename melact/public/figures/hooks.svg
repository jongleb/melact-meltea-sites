<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 446" width="896" height="446" role="img" aria-label="Every hook call gets a key at compile time. Hooks are slots found by key, and the Rules of Hooks are checked by the type checker. melact-ppx gives every hook call site its own Type.Id key, hoisted to module level; the instance stores each slot with the key that made it; reading a slot checks provably_equal, so values come back typed; a hook behind an if, in a loop or in a callback raises the hook alert at build time, and a hook called out of order raises an error at run time instead of returning a wrong value"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">HOOKS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Every hook call gets a key at compile time</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Hooks are slots found by key, and the Rules of Hooks are checked by the type checker.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><circle cx="11" cy="17" r="11" fill="#8250df"/><text x="11" y="22" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">1</text><text x="30" y="22" font-size="14.5" xml:space="preserve" font-weight="600">Your component</text><circle cx="311" cy="17" r="11" fill="#8250df"/><text x="311" y="22" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">2</text><text x="330" y="22" font-size="14.5" xml:space="preserve" font-weight="600">melact-ppx: a key per call site</text><circle cx="631" cy="17" r="11" fill="#8250df"/><text x="631" y="22" font-size="12" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">3</text><text x="650" y="22" font-size="14.5" xml:space="preserve" font-weight="600">The instance&#x27;s slots</text><rect x="0" y="40" width="270" height="168" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><text x="14" y="68" font-size="11.5" xml:space="preserve" class="mono">let[@react.component] make () =</text><text x="14" y="87" font-size="11.5" xml:space="preserve" class="mono">  let n, setN =</text><text x="14" y="106" font-size="11.5" xml:space="preserve" class="mono">    <tspan class="accent">React.useState</tspan> (fun () -&gt; 0) in</text><text x="14" y="125" font-size="11.5" xml:space="preserve" class="mono">  <tspan class="blue">React.useEffect1</tspan> (fun () -&gt;</text><text x="14" y="144" font-size="11.5" xml:space="preserve" class="mono">      Js.log n; None)</text><text x="14" y="163" font-size="11.5" xml:space="preserve" class="mono">    [| n |];</text><text x="14" y="182" font-size="11.5" xml:space="preserve" class="mono">  &lt;b&gt;(React.int n)&lt;/b&gt;</text><rect x="300" y="60" width="290" height="58" rx="10" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4" filter="url(#lift)"/><text x="316" y="83" font-size="12" xml:space="preserve" class="mono accent" font-weight="600">let k1 = Hook.key ()</text><text x="316" y="103" font-size="11" xml:space="preserve" class="mono muted">(int, int -&gt; int) state key</text><rect x="300" y="138" width="290" height="58" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.4" filter="url(#lift)"/><text x="316" y="161" font-size="12" xml:space="preserve" class="mono blue" font-weight="600">let k2 = Hook.key ()</text><text x="316" y="181" font-size="11" xml:space="preserve" class="mono muted">int array effect_cell key</text><text x="300" y="222" font-size="11.5" xml:space="preserve" class="muted">hoisted once per module; the call becomes</text><text x="300" y="240" font-size="11.5" xml:space="preserve" class="mono accent">React.useState k1 (fun () -&gt; 0)</text><rect x="620" y="40" width="260" height="168" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><rect x="636" y="64" width="52" height="52" rx="8" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4"/><text x="662" y="95" font-size="13" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">k1</text><rect x="694" y="64" width="170" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="779" y="95" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">{ value = 3 }</text><rect x="636" y="136" width="52" height="52" rx="8" fill="#eef6ff" stroke="#0969da" stroke-width="1.4"/><text x="662" y="167" font-size="13" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">k2</text><rect x="694" y="136" width="170" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="779" y="167" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">{ deps = [|3|] }</text><text x="636" y="58" font-size="10.5" xml:space="preserve" class="faint">slot 0</text><text x="636" y="130" font-size="10.5" xml:space="preserve" class="faint">slot 1</text><line x1="594" y1="89" x2="630" y2="89" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><line x1="594" y1="167" x2="630" y2="167" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow-blue)" class="flow"/><text x="612" y="80" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">✓</text><text x="612" y="158" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="middle">✓</text><rect x="0" y="262" width="432" height="72" rx="12" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1"/><text x="18" y="288" font-size="12.5" xml:space="preserve" class="green" font-weight="700">Reading a slot: Type.Id.provably_equal k_slot k_call</text><text x="18" y="308" font-size="12" xml:space="preserve" class="muted">Some Equal → the value comes back typed. No Obj.magic,</text><text x="18" y="325" font-size="12" xml:space="preserve" class="muted">and one key used at two types does not compile.</text><rect x="448" y="262" width="432" height="72" rx="12" fill="#fff4e8" stroke="#bc4c00" stroke-width="1"/><text x="466" y="288" font-size="12.5" xml:space="preserve" class="orange" font-weight="700">A hook behind an if is caught twice</text><text x="466" y="308" font-size="12" xml:space="preserve" class="muted">build: Alert hook, which melact-ppx turns on in branches,</text><text x="466" y="325" font-size="12" xml:space="preserve" class="muted">loops and callbacks · run: slot k2 ≠ call k3 → an error</text></g></svg>