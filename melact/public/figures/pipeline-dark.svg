<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 388" width="896" height="388" role="img" aria-label="JSX becomes a template, a walk and a refresh. The markup is parsed once and cloned per mount; a render runs only the guarded writes. mlx JSX is compiled into a template hoisted to module level and a walk to its three holes: b is the first child of the div, o the next sibling of b, and the text goes at the end of o; the template is cloned once per mount; every render runs the compiled refresh, which checks count and tone and writes only the holes that read a changed one"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">HOW IT COMPILES</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">JSX becomes a template, a walk and a refresh</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">The markup is parsed once and cloned per mount; a render runs only the guarded writes.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="2" y="22" font-size="14" xml:space="preserve" font-weight="600">1 · You write JSX in mlx</text><text x="292" y="22" font-size="14" xml:space="preserve" font-weight="600">2 · Melact compiles a template</text><text x="652" y="22" font-size="14" xml:space="preserve" font-weight="600">3 · The DOM</text><rect x="0" y="40" width="230" height="236" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="14" y="74" font-size="12" xml:space="preserve" class="mono">&lt;div className=&quot;counter&quot;&gt;</text><text x="14" y="96" font-size="12" xml:space="preserve" class="mono">  &lt;button onClick=<tspan class="accent">dec</tspan>&gt;</text><text x="14" y="118" font-size="12" xml:space="preserve" class="mono">    (React.string &quot;-&quot;)</text><text x="14" y="140" font-size="12" xml:space="preserve" class="mono">  &lt;/button&gt;</text><text x="14" y="162" font-size="12" xml:space="preserve" class="mono">  &lt;output className=<tspan class="accent">tone</tspan>&gt;</text><text x="14" y="184" font-size="12" xml:space="preserve" class="mono">    <tspan class="accent">(React.int count)</tspan></text><text x="14" y="206" font-size="12" xml:space="preserve" class="mono">  &lt;/output&gt;</text><text x="14" y="228" font-size="12" xml:space="preserve" class="mono">&lt;/div&gt;</text><text x="14" y="262" font-size="11.5" xml:space="preserve" class="muted">purple: dynamic, everything else static</text><rect x="290" y="40" width="300" height="118" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1" stroke-dasharray="4 4"/><text x="306" y="62" font-size="11.5" xml:space="preserve" class="accent" font-weight="600">once, at module level</text><text x="306" y="84" font-size="12" xml:space="preserve" class="mono">&lt;div class=&quot;counter&quot;&gt;</text><text x="306" y="102" font-size="12" xml:space="preserve" class="mono"> &lt;button&gt;-&lt;/button&gt;</text><text x="306" y="120" font-size="12" xml:space="preserve" class="mono"> &lt;output<tspan class="accent"> ●</tspan>&gt;<tspan class="accent">●</tspan>&lt;/output&gt;</text><text x="306" y="138" font-size="12" xml:space="preserve" class="mono">&lt;/div&gt;</text><text x="486" y="84" font-size="11.5" xml:space="preserve" class="muted">the walk</text><text x="486" y="102" font-size="10.5" xml:space="preserve" class="mono accent">b = first div</text><text x="486" y="118" font-size="10.5" xml:space="preserve" class="mono accent">o = next b</text><text x="486" y="134" font-size="10.5" xml:space="preserve" class="mono accent">text: end of o</text><rect x="290" y="172" width="300" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="306" y="194" font-size="11.5" xml:space="preserve" class="blue" font-weight="600">every render: the compiled refresh</text><text x="306" y="216" font-size="12" xml:space="preserve" class="mono">check count; check tone</text><text x="306" y="234" font-size="12" xml:space="preserve" class="mono">if tone: set class</text><text x="306" y="252" font-size="12" xml:space="preserve" class="mono">if count: set text</text><text x="500" y="234" font-size="11.5" xml:space="preserve" class="muted">others:</text><text x="500" y="250" font-size="11.5" xml:space="preserve" class="muted">not evaluated</text><rect x="650" y="40" width="230" height="236" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="664" y="76" font-size="12.5" xml:space="preserve" class="mono">div.counter</text><text x="680" y="106" font-size="12.5" xml:space="preserve" class="mono">button</text><rect x="774" y="92" width="96" height="20" rx="10" fill="#221a38" stroke="#b58cff" stroke-width="1"/><text x="822" y="106" font-size="10.5" xml:space="preserve" class="accent" text-anchor="middle">click → dec</text><text x="696" y="130" font-size="12.5" xml:space="preserve" class="mono">&quot;-&quot;</text><text x="680" y="166" font-size="12.5" xml:space="preserve" class="mono">output</text><rect x="774" y="152" width="96" height="20" rx="10" fill="#221a38" stroke="#b58cff" stroke-width="1"/><text x="822" y="166" font-size="10.5" xml:space="preserve" class="accent" text-anchor="middle">class=&quot;warm&quot;</text><text x="696" y="196" font-size="12.5" xml:space="preserve" class="mono">&quot;42&quot;</text><rect x="774" y="182" width="96" height="20" rx="10" fill="#221a38" stroke="#b58cff" stroke-width="1"/><text x="822" y="196" font-size="10.5" xml:space="preserve" class="accent" text-anchor="middle">text node</text><path d="M670,82 V166 M670,106 H676 M670,166 H676 M686,112 V130 M686,130 H692 M686,172 V196 M686,196 H692" fill="none" stroke="#30363d" stroke-width="1.4"/><text x="664" y="236" font-size="11.5" xml:space="preserve" class="muted">3 holes reached by the walk,</text><text x="664" y="254" font-size="11.5" xml:space="preserve" class="muted">the rest gets no DOM writes</text><line x1="234" y1="140" x2="284" y2="140" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><text x="259" y="124" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">build</text><line x1="594" y1="98" x2="644" y2="98" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><text x="619" y="84" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">clone</text><line x1="594" y1="224" x2="644" y2="224" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-blue)" class="flow"/><text x="619" y="210" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">patch</text></g></svg>