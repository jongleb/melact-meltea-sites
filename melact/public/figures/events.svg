<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 468" width="896" height="468" role="img" aria-label="One listener per event type, on document. Handlers live on their elements; React&#x27;s event objects and semantics are kept. One listener per event type on the document; on a click Melact walks from the target up through parent nodes and calls the handler stored on each element, with event.currentTarget set to that element as React does; React.Event reads the native event directly, since ofNative is the identity; a handler is replaced with one property write, and only when a value it reads changed"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">EVENTS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">One listener per event type, on document</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Handlers live on their elements; React&#x27;s event objects and semantics are kept.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="150" y="38" width="120" height="32" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="210" y="59" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">document</text><text x="300" y="59" font-size="11.5" xml:space="preserve" class="muted">1 listener per event type</text><rect x="150" y="86" width="120" height="32" rx="8" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4"/><text x="210" y="107" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">div</text><text x="300" y="107" font-size="11.5" xml:space="preserve" class="mono accent">$$melhole:click = outer</text><rect x="150" y="134" width="120" height="32" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="210" y="155" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">ul</text><rect x="150" y="182" width="120" height="32" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/><text x="210" y="203" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">li</text><rect x="150" y="230" width="120" height="32" rx="8" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4"/><text x="210" y="251" font-size="13" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">button</text><text x="300" y="251" font-size="11.5" xml:space="preserve" class="mono accent">$$melhole:click = inner</text><path d="M146,236 C96,200 96,80 146,48" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><text x="18" y="146" font-size="11.5" xml:space="preserve" class="muted">native</text><text x="18" y="162" font-size="11.5" xml:space="preserve" class="muted">bubbling</text><path d="M274,240 C336,200 336,130 274,96" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-accent)" class="flow"/><text x="326" y="172" font-size="11.5" xml:space="preserve" class="accent" font-weight="600">walk</text><circle cx="152" cy="246" r="6" fill="#bc4c00" class="pulse"/><text x="118" y="276" font-size="11.5" xml:space="preserve" class="orange" font-weight="600">click</text><text x="0" y="336" font-size="12" xml:space="preserve" class="muted">From the target up, Melact calls each element&#x27;s $$melhole:click; stopPropagation ends the walk.</text><text x="0" y="354" font-size="12" xml:space="preserve" class="muted">22 bubbling types are delegated; scroll, focus, load … get one listener on their element.</text><rect x="540" y="0" width="340" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><text x="560" y="34" font-size="14" xml:space="preserve" font-weight="600">While a handler runs</text><rect x="560" y="46" width="300" height="28" rx="7" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="572" y="65" font-size="12" xml:space="preserve" class="mono accent" font-weight="600">e.currentTarget  ⟶  its element</text><text x="560" y="94" font-size="11.5" xml:space="preserve" class="muted">set for the call, as React does; removed after</text><text x="560" y="126" font-size="14" xml:space="preserve" font-weight="600">React.Event is the native event</text><rect x="560" y="138" width="300" height="28" rx="7" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="572" y="157" font-size="12" xml:space="preserve" class="mono accent" font-weight="600">Mouse.clientX e  =  e.clientX</text><text x="560" y="186" font-size="11.5" xml:space="preserve" class="muted">ofNative is the identity: no synthetic copy</text><text x="560" y="218" font-size="14" xml:space="preserve" font-weight="600">Replacing a handler</text><rect x="560" y="230" width="300" height="28" rx="7" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="572" y="249" font-size="12" xml:space="preserve" class="mono accent" font-weight="600">el[&quot;$$melhole:click&quot;] = next</text><text x="560" y="278" font-size="11.5" xml:space="preserve" class="muted">only when a value it reads changed; no listener</text></g></svg>