<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 448" width="896" height="448" role="img" aria-label="The fewest moves, the cheapest case first. Common ends, one-sided changes and stable order never reach the longest-increasing-run search. Keyed reconcile: the common prefix a and suffix f stay, c and d form the longest increasing run of old positions and stay, b and e move with one moveBefore each, which keeps focus, media and animations inside them, or insertBefore where the browser lacks it. Reconcile.plan tries the cheapest case first: trim the common ends, where a swapped first and last row costs two moves; an empty side is one append or one clear; keys in the same order are patched in place without a plan; anything else looks old keys up in a hash table, keeps the longest increasing run and moves the rest"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">KEYED LISTS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">The fewest moves, the cheapest case first</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Common ends, one-sided changes and stable order never reach the longest-increasing-run search.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="62" font-size="12" xml:space="preserve" class="muted" font-weight="600">old</text><text x="0" y="206" font-size="12" xml:space="preserve" class="muted" font-weight="600">new</text><line x1="72" y1="76" x2="72" y2="180" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)"/><path d="M150,76 C150,130 384,124 384,180" fill="none" stroke="#b58cff" stroke-width="2" marker-end="url(#arrow-accent)" class="flow"/><line x1="228" y1="76" x2="228" y2="180" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow-green)"/><line x1="306" y1="76" x2="306" y2="180" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow-green)"/><path d="M384,76 C384,130 150,124 150,180" fill="none" stroke="#b58cff" stroke-width="2" marker-end="url(#arrow-accent)" class="flow"/><line x1="462" y1="76" x2="462" y2="180" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="46" y="40" width="52" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="72" y="62" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">a</text><rect x="124" y="40" width="52" height="34" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="150" y="62" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">b</text><rect x="202" y="40" width="52" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="228" y="62" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">c</text><rect x="280" y="40" width="52" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="306" y="62" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">d</text><rect x="358" y="40" width="52" height="34" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="384" y="62" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">e</text><rect x="436" y="40" width="52" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="462" y="62" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">f</text><rect x="46" y="184" width="52" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="72" y="206" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">a</text><rect x="124" y="184" width="52" height="34" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="150" y="206" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">e</text><rect x="202" y="184" width="52" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="228" y="206" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">c</text><rect x="280" y="184" width="52" height="34" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="306" y="206" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">d</text><rect x="358" y="184" width="52" height="34" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.4"/><text x="384" y="206" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">b</text><rect x="436" y="184" width="52" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="462" y="206" font-size="14" xml:space="preserve" class="mono" font-weight="600" text-anchor="middle">f</text><rect x="0" y="242" width="14" height="10" rx="3" fill="#9198a1"/><text x="22" y="252" font-size="12" xml:space="preserve" class="muted">common prefix and suffix: patched in place</text><rect x="0" y="264" width="14" height="10" rx="3" fill="#3fb950"/><text x="22" y="274" font-size="12" xml:space="preserve" class="muted">longest increasing run of old positions: stays</text><rect x="0" y="286" width="14" height="10" rx="3" fill="#b58cff"/><text x="22" y="296" font-size="12" xml:space="preserve" class="muted">everything else: one moveBefore each, keeping focus,</text><text x="22" y="318" font-size="12" xml:space="preserve" class="muted">media and animations (insertBefore without it)</text><rect x="520" y="0" width="360" height="340" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="540" y="30" font-size="14" xml:space="preserve" font-weight="700">Reconcile.plan, cheapest case first</text><circle cx="551" cy="59" r="11" fill="#b58cff"/><text x="551" y="64" font-size="11.5" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">1</text><text x="572" y="64" font-size="13" xml:space="preserve" font-weight="600">Trim the ends</text><text x="572" y="83" font-size="11.5" xml:space="preserve" class="muted">skip the common prefix and suffix; a swapped</text><text x="572" y="100" font-size="11.5" xml:space="preserve" class="muted">first and last row costs two moves, no sort</text><circle cx="551" cy="127" r="11" fill="#b58cff"/><text x="551" y="132" font-size="11.5" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">2</text><text x="572" y="132" font-size="13" xml:space="preserve" font-weight="600">One side empty</text><text x="572" y="151" font-size="11.5" xml:space="preserve" class="muted">append every row, or clear the list with one</text><text x="572" y="168" font-size="11.5" xml:space="preserve" class="muted">textContent = &quot;&quot; when it fills its parent</text><circle cx="551" cy="195" r="11" fill="#b58cff"/><text x="551" y="200" font-size="11.5" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">3</text><text x="572" y="200" font-size="13" xml:space="preserve" font-weight="600">Same keys, same order</text><text x="572" y="219" font-size="11.5" xml:space="preserve" class="muted">the loop patches rows in place: no plan,</text><text x="572" y="236" font-size="11.5" xml:space="preserve" class="muted">no moves, and kept rows are not even called</text><circle cx="551" cy="263" r="11" fill="#b58cff"/><text x="551" y="268" font-size="11.5" xml:space="preserve" style="fill:#ffffff" font-weight="700" text-anchor="middle">4</text><text x="572" y="268" font-size="13" xml:space="preserve" font-weight="600">Anything else</text><text x="572" y="287" font-size="11.5" xml:space="preserve" class="muted">old keys go into a small hash table, so each new</text><text x="572" y="304" font-size="11.5" xml:space="preserve" class="muted">key finds its old position; the longest increasing</text><text x="572" y="321" font-size="11.5" xml:space="preserve" class="muted">run of positions stays, the rest move</text></g></svg>