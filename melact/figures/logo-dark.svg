<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0 -0 120 120" width="120" height="120" role="img" aria-label="Melact: frames turning into a funnel around one live hole"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><defs><radialGradient id="ember" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e2600c"/></radialGradient></defs><rect x="6" y="6" width="108" height="108" rx="28" fill="#161b22" stroke="#e6edf3" stroke-width="3"/><g transform="rotate(7 60 60)"><rect x="19.0" y="19.0" width="82" height="82" rx="22.8" fill="none" stroke="#e6edf3" stroke-width="2.8" stroke-opacity="0.32"><animateTransform attributeName="transform" type="rotate" values="0 60 60; 4 60 60; 0 60 60" dur="3.0s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.32;0.67;0.32" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect></g><g transform="rotate(14 60 60)"><rect x="28.0" y="28.0" width="64" height="64" rx="17.8" fill="none" stroke="#e6edf3" stroke-width="2.8" stroke-opacity="0.58"><animateTransform attributeName="transform" type="rotate" values="0 60 60; 6 60 60; 0 60 60" dur="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.58;0.93;0.58" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect></g><g transform="rotate(21 60 60)"><rect x="37.0" y="37.0" width="46" height="46" rx="12.8" fill="none" stroke="#e6edf3" stroke-width="2.8" stroke-opacity="0.84"><animateTransform attributeName="transform" type="rotate" values="0 60 60; 8 60 60; 0 60 60" dur="4.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.84;1.00;0.84" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect></g><g transform="rotate(28 60 60)"><rect x="48" y="48" width="24" height="24" rx="7.5" fill="url(#ember)" class="pulse"/><path d="M54,55 q3,-3 7,-3" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round"/></g></svg>