<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 522" width="896" height="522" role="img" aria-label="The reason-react API, kept call for call. Every line on the left compiles unchanged; on the right is what it becomes. What melact-ppx and the Melact library make of unchanged reason-react code: a JSX component is a direct call to make; React.createElement with makeProps is the same call with a key; React.Event accessors read the native event, delegated to document; each hook call gets a typed slot key; a component without hooks is a pure view with no instance; ReactDOM.Client clones templates into the element; renderToString and hydrateRoot are Served.render and Served.hydrate; ReasonReactRouter.useUrl reads the location on popstate"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">COMPATIBILITY</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">The reason-react API, kept call for call</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Every line on the left compiles unchanged; on the right is what it becomes.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="16" font-size="12.5" xml:space="preserve" class="blue" font-weight="700">your reason-react code, unchanged</text><text x="466" y="16" font-size="12.5" xml:space="preserve" class="accent" font-weight="700">what melact-ppx and Melact make of it</text><rect x="0" y="30" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="55" font-size="11.5" xml:space="preserve" class="mono">&lt;Counter label=&quot;a&quot; /&gt;</text><line x1="424" y1="50" x2="460" y2="50" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="30" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="47" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">Counter.make ~label:&quot;a&quot; ()</text><text x="480" y="63" font-size="11" xml:space="preserve" class="muted">a direct call: no props object, no element</text><rect x="0" y="78" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="103" font-size="11.5" xml:space="preserve" class="mono">React.createElement C.make (C.makeProps ~label ())</text><line x1="424" y1="98" x2="460" y2="98" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="78" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="95" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">C.make ~label ()</text><text x="480" y="111" font-size="11" xml:space="preserve" class="muted">makeProps is that call, with an optional key</text><rect x="0" y="126" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="151" font-size="11.5" xml:space="preserve" class="mono">onClick=(fun e -&gt; React.Event.Mouse.clientX e)</text><line x1="424" y1="146" x2="460" y2="146" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="126" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="143" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">e.clientX, on the native event</text><text x="480" y="159" font-size="11" xml:space="preserve" class="muted">ofNative is the identity; delegated to document</text><rect x="0" y="174" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="199" font-size="11.5" xml:space="preserve" class="mono">React.useState (fun () -&gt; 0)</text><line x1="424" y1="194" x2="460" y2="194" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="174" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="191" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">React.useState k1 (fun () -&gt; 0)</text><text x="480" y="207" font-size="11" xml:space="preserve" class="muted">a typed slot key per call site; Alert hook in an if</text><rect x="0" y="222" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="247" font-size="11.5" xml:space="preserve" class="mono">a component that calls no use…</text><line x1="424" y1="242" x2="460" y2="242" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="222" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="239" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">Melhole.View.pure</text><text x="480" y="255" font-size="11" xml:space="preserve" class="muted">no instance: kept while its inputs are ===</text><rect x="0" y="270" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="295" font-size="11.5" xml:space="preserve" class="mono">ReactDOM.Client.render (createRoot el) &lt;App /&gt;</text><line x1="424" y1="290" x2="460" y2="290" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="270" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="287" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">App&#x27;s templates cloned into el</text><text x="480" y="303" font-size="11" xml:space="preserve" class="muted">no React, no react-dom, no fiber underneath</text><rect x="0" y="318" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="343" font-size="11.5" xml:space="preserve" class="mono">ReactDOMServer.renderToString / hydrateRoot</text><line x1="424" y1="338" x2="460" y2="338" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="318" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="335" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">Served.render / Served.hydrate</text><text x="480" y="351" font-size="11" xml:space="preserve" class="muted">React&#x27;s HTML format; the browser takes it over</text><rect x="0" y="366" width="420" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="14" y="391" font-size="11.5" xml:space="preserve" class="mono">ReasonReactRouter.useUrl ()</text><line x1="424" y1="386" x2="460" y2="386" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="466" y="366" width="414" height="40" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="480" y="383" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="600">the same url record</text><text x="480" y="399" font-size="11" xml:space="preserve" class="muted">read from location on popstate</text></g></svg>