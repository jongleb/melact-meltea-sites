<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 384" width="896" height="384" role="img" aria-label="One === per local, then only the holes that read it. A click from 41 to 42 in the counter: one text node is written, nothing else is touched. The compiled refresh of counter-react on a click from 41 to 42: count changed, so the text and disabled holes run and the text node gets 42; tone, initial and the setter are the same, so the class hole is not even evaluated and the three click handlers, which read only the setter and initial, are kept"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">FINE-GRAINED UPDATES</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">One === per local, then only the holes that read it</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">A click from 41 to 42 in the counter: one text node is written, nothing else is touched.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="16" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">local the view reads</text><text x="220" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">render 41 → 42</text><text x="400" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">check</text><text x="500" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">holes that read it</text><text x="690" y="22" font-size="12" xml:space="preserve" class="muted" font-weight="600">DOM work</text><rect x="0" y="36" width="880" height="44" rx="10" fill="#fff4e8" stroke="#bc4c00" stroke-width="1" filter="url(#lift)"/><text x="16" y="63" font-size="13" xml:space="preserve" class="mono" font-weight="700">count</text><rect x="220" y="46" width="140" height="24" rx="6" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="290" y="63" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">41 → 42</text><text x="400" y="63" font-size="13" xml:space="preserve" class="mono orange" font-weight="700">changed</text><text x="500" y="63" font-size="12" xml:space="preserve" class="muted">text, disabled</text><text x="690" y="63" font-size="12" xml:space="preserve" class="orange" font-weight="600">node.data = &quot;42&quot;</text><rect x="0" y="90" width="880" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="16" y="117" font-size="13" xml:space="preserve" class="mono" font-weight="700">tone</text><rect x="220" y="100" width="140" height="24" rx="6" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="290" y="117" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">&quot;&quot; → &quot;&quot;</text><text x="400" y="117" font-size="13" xml:space="preserve" class="mono green" font-weight="700">same</text><text x="500" y="117" font-size="12" xml:space="preserve" class="muted">class</text><text x="690" y="117" font-size="12" xml:space="preserve" class="green">class not even evaluated</text><rect x="0" y="144" width="880" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="16" y="171" font-size="13" xml:space="preserve" class="mono" font-weight="700">initial</text><rect x="220" y="154" width="140" height="24" rx="6" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="290" y="171" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">0 → 0</text><text x="400" y="171" font-size="13" xml:space="preserve" class="mono green" font-weight="700">same</text><text x="500" y="171" font-size="12" xml:space="preserve" class="muted">disabled (with count)</text><text x="690" y="171" font-size="12" xml:space="preserve" class="green">evaluated, still false: no write</text><rect x="0" y="198" width="880" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="16" y="225" font-size="13" xml:space="preserve" class="mono" font-weight="700">setCount</text><rect x="220" y="208" width="140" height="24" rx="6" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="290" y="225" font-size="12" xml:space="preserve" class="mono" text-anchor="middle">stable</text><text x="400" y="225" font-size="13" xml:space="preserve" class="mono green" font-weight="700">same</text><text x="500" y="225" font-size="12" xml:space="preserve" class="muted">3 × onClick</text><text x="690" y="225" font-size="12" xml:space="preserve" class="green">handlers kept, none rebuilt</text><text x="0" y="268" font-size="12" xml:space="preserve" class="muted">One click in counter-react: four === on locals, then only the holes that read the changed one run, handlers included.</text></g></svg>