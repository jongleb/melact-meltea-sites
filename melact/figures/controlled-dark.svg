<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 564" width="896" height="564" role="img" aria-label="Fields always show the state, as in React. After input, a field the update did not take gets the state&#x27;s value back. Controlled inputs: in one tick the user types milk and presses Enter; the model&#x27;s field goes from empty to milk and back to empty while the DOM still shows milk, so the redraw&#x27;s guard sees an unchanged value and writes nothing. A guard alone leaves milk in the field, out of step with the model. In Meltea and Melact value and checked are controlled holes: after an input or change event and the redraw it causes, the hole writes its last value back if the DOM differs, as React does; a write to value also sets defaultValue, so the value attribute stays in step, as in React"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">CONTROLLED INPUTS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Fields always show the state, as in React</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">After input, a field the update did not take gets the state&#x27;s value back.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="20" y="20" font-size="14" xml:space="preserve" font-weight="700">One tick: the user types and presses Enter before the next draw</text><line x1="20" y1="66" x2="860" y2="66" stroke="#30363d" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><rect x="111.5" y="54" width="67.0" height="24" rx="12" fill="#2b1d12" stroke="#f0883e" stroke-width="1.3"/><circle cx="123.5" cy="66" r="4" fill="#f0883e" class="pulse"/><text x="151" y="70.5" font-size="12" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">input</text><rect x="376.9" y="54" width="126.2" height="24" rx="12" fill="#2b1d12" stroke="#f0883e" stroke-width="1.3"/><circle cx="388.9" cy="66" r="4" fill="#f0883e" class="pulse"/><text x="446" y="70.5" font-size="12" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">keydown Enter</text><rect x="697.8" y="54" width="74.4" height="24" rx="12" fill="#0f2136" stroke="#58a6ff" stroke-width="1.3"/><circle cx="709.8" cy="66" r="4" fill="#58a6ff" class="pulse"/><text x="741" y="70.5" font-size="12" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">redraw</text><rect x="20" y="94" width="250" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><line x1="276" y1="160" x2="309" y2="160" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="315" y="94" width="250" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><line x1="571" y1="160" x2="604" y2="160" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="610" y="94" width="250" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="36" y="116" font-size="11.5" xml:space="preserve" class="faint" font-weight="600">the DOM</text><rect x="36" y="124" width="218" height="34" rx="7" fill="#161b22" stroke="#b58cff" stroke-width="1.6"/><text x="48" y="147" font-size="15" xml:space="preserve" class="mono" font-weight="600">milk</text><line x1="86.4" y1="132" x2="86.4" y2="150" stroke="#b58cff" stroke-width="2" class="pulse"/><text x="36" y="186" font-size="12.5" xml:space="preserve" class="mono"><tspan class="accent">Type </tspan><tspan class="accent">&quot;milk&quot;</tspan></text><text x="36" y="210" font-size="12.5" xml:space="preserve" class="mono"><tspan class="muted">field = &quot;milk&quot;</tspan></text><text x="331" y="116" font-size="11.5" xml:space="preserve" class="faint" font-weight="600">the DOM, untouched</text><rect x="331" y="124" width="218" height="34" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.6"/><text x="343" y="147" font-size="15" xml:space="preserve" class="mono" font-weight="600">milk</text><text x="331" y="186" font-size="12.5" xml:space="preserve" class="mono"><tspan class="accent">Add</tspan><tspan class="muted">  → a new todo</tspan></text><text x="331" y="210" font-size="12.5" xml:space="preserve" class="mono"><tspan class="muted">field = &quot;&quot;</tspan></text><text x="626" y="116" font-size="11.5" xml:space="preserve" class="faint" font-weight="600">the guard on field</text><rect x="626" y="124" width="218" height="34" rx="17" fill="#0f2136" stroke="#58a6ff" stroke-width="1.4"/><text x="735" y="148" font-size="14" xml:space="preserve" class="mono" text-anchor="middle">&quot;&quot;<tspan class="blue"> === </tspan>&quot;&quot;</text><text x="626" y="186" font-size="12.5" xml:space="preserve" class="mono"><tspan class="muted">new &quot;&quot; is last &quot;&quot;</tspan></text><text x="626" y="210" font-size="12.5" xml:space="preserve" class="mono"><tspan class="muted">unchanged → </tspan><tspan class="blue">no write</tspan></text><rect x="20" y="250" width="410" height="168" rx="14" fill="#2b1d12" stroke="#f0883e" stroke-width="1.5"/><text x="40" y="278" font-size="14" xml:space="preserve" class="orange" font-weight="700">a guard alone</text><rect x="40" y="294" width="320" height="34" rx="7" fill="#161b22" stroke="#f0883e" stroke-width="1.6"/><text x="52" y="317" font-size="15" xml:space="preserve" class="mono" font-weight="600">milk</text><circle cx="396" cy="311" r="12" fill="#f0883e"/><path d="M391.5,306.5 l9,9 M400.5,306.5 l-9,9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="352" font-size="11.5" xml:space="preserve" class="mono"><tspan class="muted">nothing writes the field again:</tspan></text><text x="40" y="376" font-size="15" xml:space="preserve" class="mono"><tspan class="muted">DOM </tspan>&quot;milk&quot;<tspan class="orange">  ≠  </tspan><tspan class="muted">model </tspan>&quot;&quot;</text><rect x="450" y="250" width="410" height="168" rx="14" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="470" y="278" font-size="14" xml:space="preserve" class="green" font-weight="700">value and checked: controlled holes</text><rect x="470" y="294" width="320" height="34" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4 3"/><text x="482" y="317" font-size="13.5" xml:space="preserve" class="faint">What needs to be done?</text><circle cx="826" cy="311" r="12" fill="#3fb950"/><path d="M821,311 l3.5,3.8 l6.5,-7.6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="350" font-size="11.5" xml:space="preserve" class="mono"><tspan class="muted">after input/change and the redraw:</tspan></text><text x="470" y="373" font-size="13" xml:space="preserve" class="mono">if (el.value !== last) <tspan class="green">el.value = last</tspan></text><text x="470" y="400" font-size="11.5" xml:space="preserve" class="mono"><tspan class="muted">a write to value also sets </tspan><tspan class="green">el.defaultValue</tspan></text><text x="440" y="448" font-size="12.5" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">the guard still skips unchanged values, and the field always shows the model, as React&#x27;s controlled inputs</text></g></svg>