<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 504" width="896" height="504" role="img" aria-label="React compares trees. Melact compares variables.. One render of the counter: React allocates and diffs five elements, Melact checks four locals. One click in the counter, from 1 to 2. React builds a new tree of 5 elements and 5 props objects, walks it against the previous tree and writes one text. Melact keeps the markup as a template parsed once and runs the refresh the compiler generated for it: one === on each of the four locals the view reads (count, initial, tone and the setter), only the holes that read the changed one are evaluated, the click handlers, which read only unchanged locals, are kept, and it writes the same one text"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">NO VIRTUAL DOM</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">React compares trees. Melact compares variables.</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">One render of the counter: React allocates and diffs five elements, Melact checks four locals.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="20" font-size="16" xml:space="preserve" font-weight="800">React</text><text x="52" y="20" font-size="13.5" xml:space="preserve" class="muted">builds a virtual DOM every render</text><text x="460" y="20" font-size="16" xml:space="preserve" class="accent" font-weight="800">Melact</text><text x="522" y="20" font-size="13.5" xml:space="preserve" class="muted">has no virtual DOM</text><line x1="440" y1="0" x2="440" y2="392" stroke="#30363d" stroke-dasharray="3 5"/><text x="0" y="50" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">tree of render 1</text><rect x="0" y="62" width="188" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="10" y="79" font-size="11" xml:space="preserve" class="mono">div.counter</text><rect x="16" y="96" width="172" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="26" y="113" font-size="11" xml:space="preserve" class="mono">button  onClick</text><rect x="16" y="130" width="172" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="26" y="147" font-size="11" xml:space="preserve" class="mono">output  className</text><rect x="16" y="164" width="172" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="26" y="181" font-size="11" xml:space="preserve" class="mono">button  onClick</text><rect x="16" y="198" width="172" height="26" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="26" y="215" font-size="11" xml:space="preserve" class="mono">button  disabled</text><text x="226" y="50" font-size="11.5" xml:space="preserve" class="orange" font-weight="600">tree of render 2: all new objects</text><rect x="226" y="62" width="188" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2" filter="url(#lift)"/><text x="236" y="79" font-size="11" xml:space="preserve" class="mono">div.counter</text><line x1="192" y1="75" x2="222" y2="75" stroke="#f0883e" stroke-width="1.2" marker-end="url(#arrow-orange)"/><rect x="242" y="96" width="172" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2" filter="url(#lift)"/><text x="252" y="113" font-size="11" xml:space="preserve" class="mono">button  onClick</text><line x1="192" y1="109" x2="238" y2="109" stroke="#f0883e" stroke-width="1.2" marker-end="url(#arrow-orange)"/><rect x="242" y="130" width="172" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2" filter="url(#lift)"/><text x="252" y="147" font-size="11" xml:space="preserve" class="mono">output  className</text><line x1="192" y1="143" x2="238" y2="143" stroke="#f0883e" stroke-width="1.2" marker-end="url(#arrow-orange)"/><rect x="242" y="164" width="172" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2" filter="url(#lift)"/><text x="252" y="181" font-size="11" xml:space="preserve" class="mono">button  onClick</text><line x1="192" y1="177" x2="238" y2="177" stroke="#f0883e" stroke-width="1.2" marker-end="url(#arrow-orange)"/><rect x="242" y="198" width="172" height="26" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2" filter="url(#lift)"/><text x="252" y="215" font-size="11" xml:space="preserve" class="mono">button  disabled</text><line x1="192" y1="211" x2="238" y2="211" stroke="#f0883e" stroke-width="1.2" marker-end="url(#arrow-orange)"/><text x="207" y="238" font-size="11" xml:space="preserve" class="orange" font-weight="700" text-anchor="middle">diff</text><rect x="0" y="260" width="414" height="28" rx="14" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="16" y="279" font-size="12.5" xml:space="preserve" class="orange" font-weight="600">5 elements + 5 props objects allocated</text><rect x="0" y="296" width="414" height="28" rx="14" fill="#2b1d12" stroke="#f0883e" stroke-width="1.2"/><text x="16" y="315" font-size="12.5" xml:space="preserve" class="orange" font-weight="600">5 nodes walked, every prop compared</text><rect x="0" y="332" width="414" height="28" rx="14" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/><text x="16" y="351" font-size="12.5" xml:space="preserve" class="green" font-weight="600">1 DOM write: the text &quot;2&quot;</text><rect x="460" y="36" width="420" height="150" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/><text x="476" y="58" font-size="11.5" xml:space="preserve" class="faint" font-weight="600">template · parsed once, never rebuilt, never compared</text><text x="476" y="82" font-size="12" xml:space="preserve" class="mono faint">&lt;div class=&quot;counter&quot;&gt;</text><text x="476" y="102" font-size="12" xml:space="preserve" class="mono faint">  &lt;button<tspan class="blue"> ●</tspan>&gt;-&lt;/button&gt;</text><text x="476" y="122" font-size="12" xml:space="preserve" class="mono faint">  &lt;output<tspan class="green"> ●</tspan>&gt;<tspan class="orange">●</tspan>&lt;/output&gt;</text><text x="476" y="142" font-size="12" xml:space="preserve" class="mono faint">  &lt;button<tspan class="blue"> ●</tspan>&gt;+&lt;/button&gt;</text><text x="476" y="162" font-size="12" xml:space="preserve" class="mono faint">  &lt;button<tspan class="blue"> ●</tspan><tspan class="green">●</tspan>&gt;reset&lt;/button&gt;</text><text x="476" y="178" font-size="12" xml:space="preserve" class="mono faint">&lt;/div&gt;</text><text x="460" y="212" font-size="11.5" xml:space="preserve" class="accent" font-weight="600">render 2 runs the compiled refresh: one === per local it reads</text><rect x="460" y="222" width="100" height="42" rx="7" fill="#2b1d12" stroke="#f0883e" stroke-width="1.4" filter="url(#lift)"/><text x="510" y="239" font-size="12" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">count</text><text x="510" y="256" font-size="11" xml:space="preserve" class="mono muted" text-anchor="middle">1 → 2</text><text x="510" y="280" font-size="10.5" xml:space="preserve" class="orange" font-weight="600" text-anchor="middle">changed</text><rect x="566" y="222" width="100" height="42" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="616" y="239" font-size="12" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">initial</text><text x="616" y="256" font-size="11" xml:space="preserve" class="mono muted" text-anchor="middle">0 = 0</text><text x="616" y="280" font-size="10.5" xml:space="preserve" class="green" font-weight="600" text-anchor="middle">same</text><rect x="672" y="222" width="100" height="42" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="722" y="239" font-size="12" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">tone</text><text x="722" y="256" font-size="11" xml:space="preserve" class="mono muted" text-anchor="middle">&quot;&quot; = &quot;&quot;</text><text x="722" y="280" font-size="10.5" xml:space="preserve" class="green" font-weight="600" text-anchor="middle">same</text><rect x="778" y="222" width="100" height="42" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.4"/><text x="828" y="239" font-size="12" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">setCount</text><text x="828" y="256" font-size="11" xml:space="preserve" class="mono muted" text-anchor="middle">stable</text><text x="828" y="280" font-size="10.5" xml:space="preserve" class="green" font-weight="600" text-anchor="middle">same</text><rect x="460" y="292" width="420" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="476" y="311" font-size="12.5" xml:space="preserve" class="accent" font-weight="600">class reads tone: not even evaluated</text><rect x="460" y="326" width="420" height="28" rx="14" fill="#221a38" stroke="#b58cff" stroke-width="1.2"/><text x="476" y="345" font-size="12.5" xml:space="preserve" class="accent" font-weight="600">text, disabled read count: evaluated · handlers: kept</text><rect x="460" y="360" width="420" height="28" rx="14" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/><text x="476" y="379" font-size="12.5" xml:space="preserve" class="green" font-weight="600">1 DOM write: the text &quot;2&quot;</text></g></svg>